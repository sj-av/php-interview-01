name: php-interview-stock
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: local-study-only
      POSTGRES_DB: stock_lab
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d stock_lab"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
